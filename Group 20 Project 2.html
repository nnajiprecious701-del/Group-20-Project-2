<!DOCTYPE html>
<html>
<head>
    <title>My Notes App</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #333;
         margin-bottom: 25px;   
    }
    label[for="search"] {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 5px;
    color: #333;
}

    input, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      background: white;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }
button {
        padding: 10px 16px;
        margin: 5px 5px 5px 0;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }
    button {
    background: #4a90e2;
    color: white;
}
    #saveButton {
    background: #28a745;
}
    #deleteButton {
    background: #dc3545;
}
.favoriteButton {
    background: #ffc107;
    color: #333;
}
    #notesContainer div {
        background: white;
        padding: 15px;
        margin-top: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #notesContainer h3 {
    margin-bottom: 10px;
    color: #333;
}

#notesContainer p {
    color: #555;
    line-height: 1.5;
  font-size: 16px;
}
    #notesContainer small {
    color: #888;
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
}
</style>
</head>

<body>

    <h1>My Notes App</h1>

    <input type="text" id="title" placeholder="Enter note title">

    <br><br>

    <textarea id="content" placeholder="Write your note here"></textarea>

    <br><br>

    <button id="saveButton" onclick="saveNote()">Save Note</button>

    <h2>My Saved Notes</h2>
<div id="notesContainer"></div>
  <label for="search">Search your notes</label>
<input type="text" id="search" placeholder="Search notes by title or keyword...">
</body>
 <script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];
let editingId = null;
function saveNote() {

    const title = document.getElementById("title").value.trim();

    const content = document.getElementById("content").value.trim();

    if (title === "" || content === "") {

        alert("Please enter both a title and note.");

        return;
    }

    if (editingId !== null) {

    const note = notes.find(n => n.id === editingId);

    note.title = title;
    note.content = content;

    editingId = null;

} else {

    const newNote = {
        id: Date.now(),
        title: title,
        content: content,
      date: new Date().toLocaleString(),
      favorite: false
    };

    notes.push(newNote);
}

        

        

        

    

    

    localStorage.setItem("notes", JSON.stringify(notes));

    displayNotes();

    document.getElementById("title").value = "";

    document.getElementById("content").value = "";
}

function displayNotes() {

    const container = document.getElementById("notesContainer");

    container.innerHTML = "";

    notes.forEach(function(note) {

        const noteElement = document.createElement("div");

noteElement.innerHTML =
    "<h3>" + note.title + "</h3>" +
  "<small>" + (note.date || "") + "</small>" +
    "<p>" + note.content + "</p>" +
    "<button type='button' onclick='editNote(" + note.id + ")'>Edit</button>" + "<button type='button'class='favoriteButton' onclick='toggleFavorite(" + note.id + ")'>" + (note.favorite ? "★ Favorite" : "☆ Favorite") + "</button>" +
    "<button type='button'id='deleteButton' onclick='deleteNote(" + note.id + ")'>Delete</button>";
    
    
      
            
            

        container.appendChild(noteElement);

    });
}

function editNote(id) {
    const note = notes.find(n => n.id === id);
    editingId = id;
    document.getElementById("title").value = note.title;
    document.getElementById("content").value = note.content;
}   
   function deleteNote(id) {

    notes = notes.filter(function(note) {
        return note.id !== id;
    });

    localStorage.setItem("notes", JSON.stringify(notes));

    displayNotes();
}
   function toggleFavorite(id) {

    const note = notes.find(function(note) {
        return note.id === id;
    });

    note.favorite = !note.favorite;

    localStorage.setItem("notes", JSON.stringify(notes));

    displayNotes();
}
   document.getElementById("search").addEventListener("input", function() {

    const searchText = this.value.toLowerCase();

    const filteredNotes = notes.filter(function(note) {

        return note.title.toLowerCase().includes(searchText) ||
               note.content.toLowerCase().includes(searchText);

    });

    const container = document.getElementById("notesContainer");

    container.innerHTML = "";

    filteredNotes.forEach(function(note) {

        const noteElement = document.createElement("div");

        noteElement.innerHTML =
    "<h3>" + note.title + "</h3>" +
   "<small>" + (note.date || "") + "</small>" +
    "<p>" + note.content + "</p>" +
    "<button type='button' onclick='editNote(" + note.id + ")'>Edit</button>" + "<button type='button'class='favoriteButton' onclick='toggleFavorite(" + note.id + ")'>" + (note.favorite ? "★ Favorite" : "☆ Favorite") + "</button>" +
    "<button type='button'id='deleteButton' onclick='deleteNote(" + note.id + ")'>Delete</button>";
             
            
    

        container.appendChild(noteElement);

    });

});
   displayNotes();

</script> 
</body>
</html>
